<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Дерево Хаффмана для слова ABRACADABRA</title>
  <rect width="680" height="390" rx="12" fill="#1a1a19"/>
  <text x="24" y="34" font-size="14" fill="#898781">Дерево для «ABRACADABRA»</text>

  <!-- ребра: від центру до центру, вузли малюються поверх -->
  <g stroke="#3a3a38" stroke-width="2">
    <line x1="340" y1="60" x2="170" y2="155"/>
    <line x1="340" y1="60" x2="480" y2="155"/>
    <line x1="480" y1="155" x2="390" y2="245"/>
    <line x1="480" y1="155" x2="570" y2="245"/>
    <line x1="390" y1="245" x2="345" y2="325"/>
    <line x1="390" y1="245" x2="435" y2="325"/>
    <line x1="570" y1="245" x2="525" y2="325"/>
    <line x1="570" y1="245" x2="615" y2="325"/>
  </g>

  <!-- біти на ребрах: ліворуч 0, праворуч 1 -->
  <g font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="middle" dominant-baseline="central">
    <g fill="#151515" stroke="#3a3a38" stroke-width="1.5">
      <circle cx="255" cy="107" r="11"/>
      <circle cx="410" cy="107" r="11"/>
      <circle cx="435" cy="200" r="11"/>
      <circle cx="525" cy="200" r="11"/>
      <circle cx="367" cy="285" r="11"/>
      <circle cx="413" cy="285" r="11"/>
      <circle cx="547" cy="285" r="11"/>
      <circle cx="593" cy="285" r="11"/>
    </g>
    <text x="255" y="107">0</text>
    <text x="410" y="107">1</text>
    <text x="435" y="200">0</text>
    <text x="525" y="200">1</text>
    <text x="367" y="285">0</text>
    <text x="413" y="285">1</text>
    <text x="547" y="285">0</text>
    <text x="593" y="285">1</text>
  </g>

  <!-- внутрішні вузли: сума частот -->
  <g fill="#222221" stroke="#3a3a38" stroke-width="2">
    <circle cx="340" cy="60" r="26"/>
    <circle cx="480" cy="155" r="22"/>
    <circle cx="390" cy="245" r="22"/>
    <circle cx="570" cy="245" r="22"/>
  </g>
  <g font-size="16" font-weight="600" fill="#f0efec" text-anchor="middle" dominant-baseline="central">
    <text x="340" y="60">11</text>
    <text x="480" y="155">6</text>
    <text x="390" y="245">2</text>
    <text x="570" y="245">4</text>
  </g>

  <!-- листки: символ · частота -->
  <g fill="#2a78d6">
    <rect x="134" y="135" width="72" height="40" rx="10"/>
    <rect x="309" y="305" width="72" height="40" rx="10"/>
    <rect x="399" y="305" width="72" height="40" rx="10"/>
    <rect x="489" y="305" width="72" height="40" rx="10"/>
    <rect x="579" y="305" width="72" height="40" rx="10"/>
  </g>
  <g font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="170" y="155">A · 5</text>
    <text x="345" y="325">C · 1</text>
    <text x="435" y="325">D · 1</text>
    <text x="525" y="325">B · 2</text>
    <text x="615" y="325">R · 2</text>
  </g>

  <!-- коди символів: шлях від кореня до листка -->
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#0ca311" text-anchor="middle" dominant-baseline="central">
    <text x="170" y="192">0</text>
    <text x="345" y="364">100</text>
    <text x="435" y="364">101</text>
    <text x="525" y="364">110</text>
    <text x="615" y="364">111</text>
  </g>
</svg>
