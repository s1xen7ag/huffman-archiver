<svg xmlns="http://www.w3.org/2000/svg" width="860" height="140" viewBox="0 0 860 140" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Як файли перетворюються на архів .huf</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect width="860" height="140" rx="12" fill="#1a1a19"/>

  <!-- картки етапів -->
  <rect x="20" y="20" width="175" height="100" rx="10" fill="#222221" stroke="#3a3a38" stroke-width="1.5"/>
  <rect x="235" y="20" width="175" height="100" rx="10" fill="#222221" stroke="#3a3a38" stroke-width="1.5"/>
  <rect x="450" y="20" width="175" height="100" rx="10" fill="#222221" stroke="#3a3a38" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="665" y="20" width="175" height="100" rx="10" fill="#222221" stroke="#2a78d6" stroke-width="2"/>

  <!-- стрілки між етапами -->
  <g stroke="#898781" stroke-width="2" marker-end="url(#arrow)">
    <line x1="199" y1="70" x2="229" y2="70"/>
    <line x1="414" y1="70" x2="444" y2="70"/>
    <line x1="629" y1="70" x2="659" y2="70"/>
  </g>

  <!-- номери етапів -->
  <g fill="#2a78d6">
    <circle cx="44" cy="48" r="12"/>
    <circle cx="259" cy="48" r="12"/>
    <circle cx="474" cy="48" r="12"/>
    <circle cx="689" cy="48" r="12"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="44" y="48">1</text>
    <text x="259" y="48">2</text>
    <text x="474" y="48">3</text>
    <text x="689" y="48">4</text>
  </g>

  <!-- назви етапів -->
  <g font-size="16" font-weight="600" fill="#f0efec" dominant-baseline="central">
    <text x="64" y="48">Файли</text>
    <text x="279" y="48">Хаффман</text>
    <text x="494" y="48">AES-256-GCM</text>
    <text x="709" y="48">Архів .huf</text>
  </g>

  <!-- пояснення -->
  <g font-size="13" fill="#c3c2b7">
    <text x="34" y="84">файли й папки</text>
    <text x="34" y="103">з підпапками</text>
    <text x="249" y="84">кожен файл окремо;</text>
    <text x="249" y="103">не стискається — як є</text>
    <text x="464" y="84">лише якщо</text>
    <text x="464" y="103">задано пароль</text>
    <text x="679" y="84">заголовок і записи:</text>
    <text x="679" y="103">ім'я, розміри, CRC32</text>
  </g>
</svg>
